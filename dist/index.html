e:`Artista`,desc:`Vive de obra, processo e pesquisa. Quer usar IA como expansão da própria linguagem, sem virar filtro pronto que apaga a autoria.`},{title:`Desenvolvedor`,desc:`Já programa há tempos. Quer integrar IA ao stack como linguagem nativa e operar sistemas em vez de só escrever código, sem virar promptador.`},{title:`Empreendedor criativo`,desc:`Tem um negócio em pé, mas sabe que o jogo da próxima década depende de saber operar sistemas criativos com IA, não só contratar quem opera.`},{title:`Curioso`,desc:`Não tem formação numa única caixa. Cruza áreas, conecta ideias, vê padrões. O Overpass é praticamente uma academia para esse perfil.`}],Af=[{initials:`JV`,name:`Jonathan Vieira`,role:`Designer : Aluno Overpass`,group:`plataforma`,quote:`Sinceramente, em anos de estudo de design, é o primeiro curso livre que me surpreende já na primeira aula. Parabéns!`},{initials:`KG`,name:`Kalleb Henrique Afonso Garcia`,role:`Aluno Overpass`,group:`plataforma`,quote:`Comprei o curso hoje e já me surpreendi com o nível técnico repassado, especialmente por ter base no repertório acadêmico. Não fiz faculdade de design, mas o que está sendo entregue aqui, não vi mais em nenhum outro lugar!`},{initials:`LA`,name:`Lívia Alves Fernandes`,role:`Aluna Overpass`,group:`plataforma`,quote:`Que aula rica!! Nunca vi um curso tão profundo em conteúdo como esse e isso me faz ter orgulho de cada centavo investido nessa plataforma!`},{initials:`NC`,name:`Nahila Coelho`,role:`Aluna Overpass`,group:`plataforma`,quote:`Nem na faculdade eu tive uma aula técnica assim tão completa e tão didática de cores. Todas dúvidas que eu tinha até aqui foram sanadas com sucesso.`},{initials:`NA`,name:`Nathália Araujo`,role:`Aluna Overpass`,group:`plataforma`,quote:`Não lembro de uma aula igual a essa no início da faculdade 🥲 agora tá fazendo mais sentido.`},{initials:`TX`,name:`Tiago Matias Xavier`,role:`Aluno Overpass`,group:`plataforma`,quote:`Muito interessante que o objetivo do projeto tem mostrado, querendo formar pessoas de verdade, com profundidade.`},{initials:`RM`,name:`Ramon Rodrigues Marques`,role:`Aluno Overpass`,group:`plataforma`,quote:`O curso é tão completo que aborda até as suas crenças, e isso é fundamental.`},{initials:`CP`,name:`Cys Pacheco`,role:`Aluna Overpass`,group:`plataforma`,quote:`Esta aula foi, sem dúvidas, um divisor de águas: ouso dizer que é uma releitura moderna da Alegoria da Caverna, de Platão.`},{initials:`AA`,name:`Andressa Alves da Silva Carvalho`,role:`Designer : Aluna Overpass`,group:`plataforma`,quote:`Eu amo a didática do Ruan, ele me ajuda a pensar a raciocinar, ele é o nosso Filósofo do Design.`},{initials:`VD`,name:`Vinni Del Poço`,role:`Aluno Overpass`,group:`plataforma`,quote:`A plataforma tá linda, com visual impecável e densidade rara. Parabéns à equipe da Overlens!`},{initials:`BL`,name:`Bruno Lujan`,role:`Aluno Overpass`,group:`plataforma`,quote:`Assinei o Overpass ontem e decidi começar pelas lives e, sinceramente, que sensacional os ensinamentos delas. Inacreditável que você disponibiliza esse conteúdo de graça toda semana.`},{initials:`BC`,name:`Bruno Chaves`,role:`Aluno Overpass`,group:`plataforma`,quote:`Eu to extremamente feliz por ter acreditado e investido nesse curso. A Overlens apareceu do nada no meu feed... Eu vi os conteúdos, acreditei e confiei muito, e agora a cada aula é um monte de coisa que encaixa na minha cabeça.`},{initials:`MT`,name:`Maiham Therena`,role:`Designer : Aluna Overpass`,group:`virada`,quote:`Curso realmente fantástico, consegui apresentar e fazer um fechamento no meio da apresentação. Do meio para o final o cliente já perguntou qual é o valor e quais os próximos passos. Em pensar que eu já tinha pensado em desistir de ser designer por não saber conversar e nem entender de processos.`},{initials:`BR`,name:`Bia Rosa`,role:`Designer : Aluna Overpass`,group:`virada`,quote:`Quando eu comprei tava muito mal de grana, tinha sido desligada, mas achei que ia me ajudar. E, agora, to conseguindo entrar em contato com os primeiros clientes e nem terminei o curso.`},{initials:`AL`,name:`André Lucas Jesus Cavalcante`,role:`Aluno Overpass`,group:`virada`,quote:`O maior valor que eu pude tirar desse curso foi como abordar um lead. Tenho muita dificuldade em conversar e vender o meu serviço. E os ensinamentos daquela aula me ajudaram bastante. SHOW DEMAIS!`},{initials:`MV`,name:`Monica Veiga`,role:`Mestranda : Aluna Overpass`,group:`manifesto`,quote:`Cara, essa aula me caiu como uma luva hoje. Tô num mestrado interdisciplinar, mas que me parece interdisciplinar só na intenção, porque nem a universidade tá preparada pra sustentar um projeto desses. A minha dissertação vai ter que ter um capítulo falando sobre o obstáculo epistemológico, e definitivamente você será mencionado, assim como a Overlens. Só tenho a te agradecer.`},{initials:`VS`,name:`Vinicio`,role:`Assistente social : Aluno Overpass`,group:`manifesto`,quote:`Ruan você está abrindo tantos horizontes aqui nessa aula, e quebrando crenças que eu tinha. Está sendo terapêutico para mim enquanto assistente social. Estou empolgado há um ano com essa transformação que a IA está gerando.`},{initials:`BT`,name:`Beatriz Ribeiro`,role:`Profissional criativa : Aluna Overpass`,group:`virada`,quote:`Filha de pais educadores da rede pública em uma zona periférica de São Paulo, decidi que dedicaria minha vida à área social. Depois de 10 anos atuando na área, entendi que sou uma profissional criativa e que o impacto que quero ver no mundo será através da arte e da cultura.`},{initials:`IB`,name:`Igor Batista`,role:`Aluno Overpass`,group:`plataforma`,quote:`Já valeu o investimento esta aula!`},{initials:`JA`,name:`Jéssica Almondes`,role:`Designer : Aluna Overpass`,group:`plataforma`,quote:`Depois de anos atuando como designer, hoje foi que descobri o Double Diamond. Fez todo o sentido.`},{initials:`RO`,name:`Ricardo Moreira`,role:`Aluno Overpass`,group:`plataforma`,quote:`O Ruan é mestre em storytelling e nesta aula ajudou-me muito a sustentar aquilo que fazemos e como olhar para vários assuntos com olhos de criativo.`},{initials:`MK`,name:`Marcella Kamilla`,role:`Designer : Aluna Overpass`,group:`virada`,quote:`O final dessa aula quase me fez chorar. Hoje vejo que o design é realmente meu lugar.`},{initials:`NR`,name:`Nayara Ribeiro`,role:`Designer : Aluna Overpass`,group:`virada`,quote:`Eu estou CHOCADA! Sempre me ancorei na desculpa de que "Designer" não precisa desenhar. Quando era mais nova eu AMAVA desenhar e não entendia o motivo de ter parado. Agora vou voltar a desenvolver essa habilidade. Obrigada por tanto.`},{initials:`BF`,name:`Beatriz Ferreira`,role:`Aluna Overpass`,group:`plataforma`,quote:`Se a introdução da matéria já está explodindo a minha mente, imagina o restante!? Que conteúdo precioso!`},{initials:`LP`,name:`Luiz Prudente`,role:`Aluno Overpass`,group:`virada`,quote:`Genial. Simplesmente genial. A questão das lentes foi o que fez me escolher a profissão, então ter uma definição assertiva com centenas de referências me trouxe uma clareza imensa que é isso que quero mesmo.`},{initials:`HT`,name:`Humberto Tello`,role:`Aluno Overpass`,group:`virada`,quote:`Aula excelente, mudou muito a forma como eu enxergo o design.`},{initials:`MY`,name:`Marilia Yamashita`,role:`Aluna Overpass`,group:`virada`,quote:`Que aula densa! Mas minhas logos nunca mais serão as mesmas. Valeu muito.`},{initials:`TY`,name:`Thayane Azevedo`,role:`Aluna Overpass`,group:`plataforma`,quote:`É esse nível de profundidade que venho buscando. Aula riquíssima, você foi muito além do esperado, e essa ainda é a primeira aula 🤯`},{initials:`CR`,name:`Carlos Ramos`,role:`Aluno Overpass`,group:`manifesto`,quote:`Eu precisava ler cada palavra desse manifesto. Acho que encontrei o meu lugar, o meu propósito. Encontrei o verdadeiro sentido de criação.`},{initials:`RN`,name:`Robert Nunes`,role:`Aluno Overpass`,group:`plataforma`,quote:`O tanto de novas conexões neurais que eu tive com essa aula não está escrito.`},{initials:`FD`,name:`Fabiana Dauksys Diamante`,role:`Aluna Overpass`,group:`plataforma`,quote:`Essa aula e a Meta-aprendizado abriram a minha mente de uma maneira que não posso descrever.`},{initials:`NP`,name:`Natália Pereira`,role:`Aluna Overpass`,group:`manifesto`,quote:`Quando li esse manifesto, senti como se alguém tivesse aberto a janela de uma sala onde eu respirava o mesmo air reciclado há anos. A frase "Você não está criando, está sendo usado" me atravessou como um raio.`}],jf=[{q:`Preciso saber programar ou já ter experiência com IA?`,a:`Não. As trilhas começam do nível necessário pra cada perfil. Quem nunca usou IA encontra ponto de entrada. Quem já usa encontra profundidade.`},{q:`O Overpass tem horário fixo, aulas ao vivo?`,a:`Não. Você acessa quando quiser, no seu ritmo. As trilhas têm sequência recomendada, mas a vida é sua.`},{q:`O que diferencia o Overpass de outras plataformas?`,a:`Não é catálogo. É jornada. Outras plataformas te dão acesso a 500 cursos e você não termina nenhum. O Overpass te dá um caminho, um sistema de progressão e desafios que te obrigam a aplicar.`},{q:`Tem certificado?`,a:`Sim, vinculado a marcos de evolução reais, não a "horas assistidas". O certificado prova que você fez, não que você esteve presente.`},{q:`Posso cancelar quando quiser?`,a:`Sim. Sem fidelidade, sem multa. Você entra enquanto faz sentido, sai quando não fizer mais.`},{q:`E se eu não conseguir acompanhar o ritmo?`,a:`O ritmo é seu. O sistema marca onde você parou, sugere próximos passos e mantém a progressão visível mesmo se você sair e voltar.`},{q:`O Overpass garante resultados financeiros?`,a:`Não. Resultados dependem de contexto, decisões e aplicação individual. O que o Overpass oferece é estrutura. A construção é sua.`},{q:`O Overpass é pra mim se eu só quero prompts prontos?`,a:`Não. O Overpass é pra quem quer desenvolver autonomia criativa. Quem busca prompt-de-bolso encontra coisa melhor no Twitter. Quem quer construir capacidade encontra a
